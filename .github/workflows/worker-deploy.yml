name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - messaging/**
      - .github/workflows/worker-deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        shell: bash
        run: npm install -g wrangler

      - name: Create KV namespaces if first deploy
        id: kv-setup
        shell: bash
        run: |
          for ENTRY in "KV_PLACEHOLDER EVENTS" "AUTH_KV_PLACEHOLDER AUTH"; do
            set -- $ENTRY
            PLACEHOLDER=$1
            TITLE=$2
            if grep -q "$PLACEHOLDER" wrangler.toml; then
              ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const m=(j.result||[]).find(x=>x.title==='$TITLE');console.log(m?m.id:'');}catch(e){console.log('');}})")
              if [ -z "$ID" ]; then
                echo "Creating $TITLE KV namespace..."
                OUT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"title\":\"$TITLE\"}")
                ID=$(echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log((j.result&&j.result.id)||'');}catch(e){console.log('');}})")
              fi
              if [ -z "$ID" ]; then
                echo "Failed to create $TITLE KV namespace"
                exit 1
              fi
              sed -i "s/$PLACEHOLDER/$ID/" wrangler.toml
              echo "kv_created=true" >> "$GITHUB_OUTPUT"
            else
              echo "kv_created=false" >> "$GITHUB_OUTPUT"
            fi
          done
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Push platform secrets to the worker
        shell: bash
        run: |
          if [ -n "$VERIFY_TOKEN" ]; then printf '%s' "$VERIFY_TOKEN" | npx wrangler secret put VERIFY_TOKEN; fi
          if [ -n "$WHATSAPP_ACCESS_TOKEN" ]; then printf '%s' "$WHATSAPP_ACCESS_TOKEN" | npx wrangler secret put WHATSAPP_ACCESS_TOKEN; fi
          if [ -n "$WHATSAPP_PHONE_NUMBER_ID" ]; then printf '%s' "$WHATSAPP_PHONE_NUMBER_ID" | npx wrangler secret put WHATSAPP_PHONE_NUMBER_ID; fi
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ]; then printf '%s' "$INSTAGRAM_ACCESS_TOKEN" | npx wrangler secret put INSTAGRAM_ACCESS_TOKEN; fi
          if [ -n "$INSTAGRAM_SENDER_ID" ]; then printf '%s' "$INSTAGRAM_SENDER_ID" | npx wrangler secret put INSTAGRAM_SENDER_ID; fi
          if [ -n "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then printf '%s' "$FACEBOOK_PAGE_ACCESS_TOKEN" | npx wrangler secret put FACEBOOK_PAGE_ACCESS_TOKEN; fi
          if [ -n "$TIKTOK_ACCESS_TOKEN" ]; then printf '%s' "$TIKTOK_ACCESS_TOKEN" | npx wrangler secret put TIKTOK_ACCESS_TOKEN; fi
          if [ -n "$LINE_CHANNEL_ACCESS_TOKEN" ]; then printf '%s' "$LINE_CHANNEL_ACCESS_TOKEN" | npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN; fi
          if [ -n "$WECHAT_TOKEN" ]; then printf '%s' "$WECHAT_TOKEN" | npx wrangler secret put WECHAT_TOKEN; fi
          if [ -n "$USER_LLM_BASE_URL" ]; then printf '%s' "$USER_LLM_BASE_URL" | npx wrangler secret put USER_LLM_BASE_URL; fi
          if [ -n "$USER_LLM_MODEL" ]; then printf '%s' "$USER_LLM_MODEL" | npx wrangler secret put USER_LLM_MODEL; fi
          if [ -n "$USER_LLM_API_KEY" ]; then printf '%s' "$USER_LLM_API_KEY" | npx wrangler secret put USER_LLM_API_KEY; fi
          if [ -n "$FEDEX_API_KEY" ]; then printf '%s' "$FEDEX_API_KEY" | npx wrangler secret put FEDEX_API_KEY; fi
          if [ -n "$FEDEX_API_SECRET" ]; then printf '%s' "$FEDEX_API_SECRET" | npx wrangler secret put FEDEX_API_SECRET; fi
          if [ -n "$DHL_API_KEY" ]; then printf '%s' "$DHL_API_KEY" | npx wrangler secret put DHL_API_KEY; fi
          if [ -n "$FTP_HOST" ]; then printf '%s' "$FTP_HOST" | npx wrangler secret put FTP_HOST; fi
          if [ -n "$FTP_PORT" ]; then printf '%s' "$FTP_PORT" | npx wrangler secret put FTP_PORT; fi
          if [ -n "$FTP_USER" ]; then printf '%s' "$FTP_USER" | npx wrangler secret put FTP_USER; fi
          if [ -n "$FTP_PASS" ]; then printf '%s' "$FTP_PASS" | npx wrangler secret put FTP_PASS; fi
          if [ -n "$FTP_BASE_URL" ]; then printf '%s' "$FTP_BASE_URL" | npx wrangler secret put FTP_BASE_URL; fi
          if [ -n "$FTP_REMOTE_ROOT" ]; then printf '%s' "$FTP_REMOTE_ROOT" | npx wrangler secret put FTP_REMOTE_ROOT; fi
          if [ -n "$ADMIN_EMAIL" ]; then printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL; fi
          if [ -n "$ADMIN_PASSWORD" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_SENDER_ID: ${{ secrets.INSTAGRAM_SENDER_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          WECHAT_TOKEN: ${{ secrets.WECHAT_TOKEN }}
          USER_LLM_BASE_URL: ${{ secrets.USER_LLM_BASE_URL }}
          USER_LLM_MODEL: ${{ secrets.USER_LLM_MODEL }}
          USER_LLM_API_KEY: ${{ secrets.USER_LLM_API_KEY }}
          FEDEX_API_KEY: ${{ secrets.FEDEX_API_KEY }}
          FEDEX_API_SECRET: ${{ secrets.FEDEX_API_SECRET }}
          DHL_API_KEY: ${{ secrets.DHL_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_BASE_URL: ${{ secrets.FTP_BASE_URL }}
          FTP_REMOTE_ROOT: ${{ secrets.FTP_REMOTE_ROOT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/worker-deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        shell: bash
        run: npm install -g wrangler

      - name: Create KV namespace if first deploy
        id: kv-setup
        shell: bash
        run: |
          if grep -q "KV_PLACEHOLDER" wrangler.toml; then
            ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);const m=(j.result||[]).find(x=>x.title==='EVENTS');console.log(m?m.id:'');}catch(e){console.log('');}})")
            if [ -z "$ID" ]; then
              echo "Creating EVENTS KV namespace..."
              OUT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"title":"EVENTS"}')
              ID=$(echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log((j.result&&j.result.id)||'');}catch(e){console.log('');}})")
            fi
            if [ -z "$ID" ]; then
              echo "Failed to create KV namespace"
              exit 1
            fi
            sed -i "s/KV_PLACEHOLDER/$ID/" wrangler.toml
            echo "kv_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "kv_created=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Push platform secrets to the worker
        shell: bash
        run: |
          if [ -n "$VERIFY_TOKEN" ]; then printf '%s' "$VERIFY_TOKEN" | npx wrangler secret put VERIFY_TOKEN; fi
          if [ -n "$WHATSAPP_ACCESS_TOKEN" ]; then printf '%s' "$WHATSAPP_ACCESS_TOKEN" | npx wrangler secret put WHATSAPP_ACCESS_TOKEN; fi
          if [ -n "$WHATSAPP_PHONE_NUMBER_ID" ]; then printf '%s' "$WHATSAPP_PHONE_NUMBER_ID" | npx wrangler secret put WHATSAPP_PHONE_NUMBER_ID; fi
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ]; then printf '%s' "$INSTAGRAM_ACCESS_TOKEN" | npx wrangler secret put INSTAGRAM_ACCESS_TOKEN; fi
          if [ -n "$INSTAGRAM_SENDER_ID" ]; then printf '%s' "$INSTAGRAM_SENDER_ID" | npx wrangler secret put INSTAGRAM_SENDER_ID; fi
          if [ -n "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then printf '%s' "$FACEBOOK_PAGE_ACCESS_TOKEN" | npx wrangler secret put FACEBOOK_PAGE_ACCESS_TOKEN; fi
          if [ -n "$TIKTOK_ACCESS_TOKEN" ]; then printf '%s' "$TIKTOK_ACCESS_TOKEN" | npx wrangler secret put TIKTOK_ACCESS_TOKEN; fi
          if [ -n "$LINE_CHANNEL_ACCESS_TOKEN" ]; then printf '%s' "$LINE_CHANNEL_ACCESS_TOKEN" | npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN; fi
          if [ -n "$WECHAT_TOKEN" ]; then printf '%s' "$WECHAT_TOKEN" | npx wrangler secret put WECHAT_TOKEN; fi
          if [ -n "$USER_LLM_BASE_URL" ]; then printf '%s' "$USER_LLM_BASE_URL" | npx wrangler secret put USER_LLM_BASE_URL; fi
          if [ -n "$USER_LLM_MODEL" ]; then printf '%s' "$USER_LLM_MODEL" | npx wrangler secret put USER_LLM_MODEL; fi
          if [ -n "$USER_LLM_API_KEY" ]; then printf '%s' "$USER_LLM_API_KEY" | npx wrangler secret put USER_LLM_API_KEY; fi
          if [ -n "$FEDEX_API_KEY" ]; then printf '%s' "$FEDEX_API_KEY" | npx wrangler secret put FEDEX_API_KEY; fi
          if [ -n "$FEDEX_API_SECRET" ]; then printf '%s' "$FEDEX_API_SECRET" | npx wrangler secret put FEDEX_API_SECRET; fi
          if [ -n "$DHL_API_KEY" ]; then printf '%s' "$DHL_API_KEY" | npx wrangler secret put DHL_API_KEY; fi
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_SENDER_ID: ${{ secrets.INSTAGRAM_SENDER_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          WECHAT_TOKEN: ${{ secrets.WECHAT_TOKEN }}
          USER_LLM_BASE_URL: ${{ secrets.USER_LLM_BASE_URL }}
          USER_LLM_MODEL: ${{ secrets.USER_LLM_MODEL }}
          USER_LLM_API_KEY: ${{ secrets.USER_LLM_API_KEY }}
          FEDEX_API_KEY: ${{ secrets.FEDEX_API_KEY }}
          FEDEX_API_SECRET: ${{ secrets.FEDEX_API_SECRET }}
          DHL_API_KEY: ${{ secrets.DHL_API_KEY }}

name: ColorDiam Auto-Pull Upload

on:
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Max products to post this run"
        required: false
        default: "5"

jobs:
  auto-pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COLORDIAM_MAX_POSTS: ${{ inputs.max_posts || '5' }}
    steps:
      - name: Checkout auto-upload repo
        uses: actions/checkout@v4
        with:
          repository: dhruvalshah3557-droid/api-upload-facebook-instagram-youtube-
          ref: 260805-feat-colourdiam-autopull
          path: auto_upload

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: auto_upload
        run: pip install -r requirements.txt

      - name: Write credential files
        shell: bash
        working-directory: auto_upload
        env:
          GOOGLE_SHEET_CREDENTIALS: ${{ secrets.GOOGLE_SHEET_CREDENTIALS }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_PICKLE: ${{ secrets.YOUTUBE_TOKEN_PICKLE }}
        run: |
          mkdir -p credentials
          if [ -n "$GOOGLE_SHEET_CREDENTIALS" ]; then
            printf '%s' "$GOOGLE_SHEET_CREDENTIALS" > credentials/service_account.json
          fi
          if [ -n "$YOUTUBE_CLIENT_SECRET" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRET" > credentials/youtube_client_secret.json
          fi
          if [ -n "$YOUTUBE_TOKEN_PICKLE" ]; then
            printf '%s' "$YOUTUBE_TOKEN_PICKLE" | base64 -d > credentials/youtube_token.pickle
          fi

      - name: Run ColorDiam auto-pull
        working-directory: auto_upload
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: python main.py --auto-pull

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Colour Diam — Rare Natural Fancy Color Diamonds</title>
<meta name="theme-color" content="#1c1a17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Colour Diam">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Since 1994, Colour Diam has specialized in sourcing exceptional natural fancy color diamonds and creating bespoke jewelry for collectors and discerning clients worldwide.">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ivory: #FAF7F2;
  --ivory-2: #F3EEE4;
  --surface: #FFFFFF;
  --ink: #1c1a17;
  --ink-2: #4a463f;
  --muted: #8a857b;
  --gold: #b68a3e;
  --gold-deep: #96691f;
  --gold-soft: rgba(182, 138, 62, .12);
  --rose: #c9a68f;
  --line: rgba(28, 26, 23, .08);
  --line-strong: rgba(28, 26, 23, .14);
  --shadow: 0 18px 44px rgba(28, 26, 23, .09);
  --shadow-sm: 0 6px 18px rgba(28, 26, 23, .06);
  --radius: 14px;
  --radius-sm: 10px;
  --ease: .28s cubic-bezier(.4, 0, .2, 1);
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --topbar-h: 64px;
  --nav-w: 76px;
  --nav-open: 268px;
  --rail-w: 300px;
  --bottomnav-h: 62px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  background: var(--ivory);
  color: var(--ink);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img, svg { display: block; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(28,26,23,.14); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(28,26,23,.28); background-clip: content-box; border: 2px solid transparent; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- Layout shell ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
  background: rgba(255,255,255,.86);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  z-index: 80;
}
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 600; font-size: 21px; letter-spacing: .02em; white-space: nowrap; }
.logo .mark {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #e8cd8a, var(--gold) 60%, var(--gold-deep));
  color: #fff; display: grid; place-items: center; font-size: 15px;
  box-shadow: 0 4px 14px rgba(182,138,62,.35);
}
.logo small { display: block; font-family: var(--sans); font-size: 8.5px; letter-spacing: .34em; color: var(--gold-deep); font-weight: 700; margin-top: 2px; }
.logo .word { line-height: 1; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid transparent; background: transparent; color: var(--ink-2);
  display: grid; place-items: center; flex-shrink: 0;
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}
.icon-btn:hover { background: var(--ivory-2); color: var(--ink); }
.icon-btn .badge {
  position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px;
  background: var(--gold); color: #fff; font-size: 9.5px; font-weight: 700;
  border-radius: 999px; display: grid; place-items: center;
}
.icon-btn.has-badge { position: relative; }
.search-wrap { flex: 1; max-width: 560px; margin: 0 auto; position: relative; }
.search-wrap input {
  width: 100%; height: 42px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: var(--ivory); color: var(--ink); padding: 0 20px 0 44px;
  font-size: 14px; font-family: inherit; outline: none;
  transition: border-color var(--ease), box-shadow var(--ease), background var(--ease);
}
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap input:focus { border-color: var(--gold); background: #fff; box-shadow: 0 0 0 3px var(--gold-soft); }
.search-wrap .s-ico { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-results {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; z-index: 90;
}
.search-results a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.search-results a:hover { background: var(--ivory); }
.search-results .th { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--ivory-2); }
.search-results .th img { width: 100%; height: 100%; object-fit: cover; }
.search-results .nm { font-size: 13.5px; font-weight: 600; }
.search-results .id { font-size: 11.5px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.select-mini {
  height: 38px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: var(--ivory); color: var(--ink-2); font-size: 13px; font-family: inherit;
  padding: 0 10px; outline: none;
}
.select-mini:focus { border-color: var(--gold); }
.menu-btn { display: none; }

.shell { display: flex; height: 100vh; height: 100dvh; padding-top: var(--topbar-h); }

/* ---------- Sidebar ---------- */
.sidebar {
  position: fixed; top: var(--topbar-h); bottom: 0; left: 0;
  width: var(--nav-w);
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-right: 1px solid var(--line);
  overflow: hidden;
  transition: width var(--ease);
  z-index: 60;
  display: flex; flex-direction: column;
}
.sidebar:hover, body.nav-open .sidebar { width: var(--nav-open); box-shadow: var(--shadow-sm); }
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar-inner { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 12px 20px; }
.side-group { margin-bottom: 22px; }
.side-group-title {
  font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  color: var(--gold-deep); padding: 0 10px 8px; white-space: nowrap; opacity: 0; transition: opacity .15s .05s;
}
.sidebar:hover .side-group-title, body.nav-open .side-group-title { opacity: 1; }
.side-item {
  display: flex; align-items: center; gap: 14px; width: 100%;
  border: none; background: transparent; color: var(--ink-2);
  padding: 10px 12px; border-radius: 12px; margin-bottom: 2px;
  font-size: 14px; font-weight: 500; font-family: inherit; text-align: left; white-space: nowrap;
  transition: background var(--ease), color var(--ease);
}
.side-item svg { flex-shrink: 0; }
.side-item:hover { background: var(--ivory-2); color: var(--ink); }
.side-item.active { background: var(--gold-soft); color: var(--gold-deep); font-weight: 600; }
.side-collapse {
  margin-top: auto; padding: 12px; border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: flex-start; gap: 14px;
}
.collapse-btn {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: var(--ivory); border: 1px solid var(--line); border-radius: 12px;
  color: var(--ink-2); font-size: 13px; font-weight: 600; font-family: inherit;
  padding: 10px 12px; transition: background var(--ease), color var(--ease);
}
.collapse-btn:hover { background: var(--ivory-2); color: var(--ink); }
.collapse-btn .lbl { white-space: nowrap; opacity: 0; transition: opacity .15s .05s; }
.sidebar:hover .collapse-btn .lbl, body.nav-open .collapse-btn .lbl { opacity: 1; }

/* ---------- Main ---------- */
.main {
  flex: 1; min-width: 0; min-height: 0;
  margin-left: var(--nav-w);
  padding-top: var(--topbar-h);
  overflow-y: auto; overflow-x: hidden;
  transition: margin-left var(--ease);
  padding-bottom: calc(var(--bottomnav-h) + 28px);
  scroll-behavior: smooth;
}
body.nav-open .main { margin-left: var(--nav-open); }
body.rail-on .main { margin-right: var(--rail-w); }
.page { max-width: 1360px; margin: 0 auto; padding: 26px 28px 40px; animation: pageIn .35s ease both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Rail ---------- */
.rail {
  position: fixed; top: var(--topbar-h); bottom: 0; right: 0; width: var(--rail-w);
  background: rgba(255,255,255,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-left: 1px solid var(--line); padding: 22px 18px;
  overflow-y: auto; z-index: 55;
}
.rail h4 { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 12px; }
.rail-card { background: var(--ivory); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 18px; }
.rail-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rail-item:last-child { border-bottom: none; }
.rail-item .th { width: 46px; height: 46px; border-radius: 9px; overflow: hidden; flex-shrink: 0; background: var(--ivory-2); }
.rail-item .th img { width: 100%; height: 100%; object-fit: cover; }
.rail-item .nm { font-size: 12.5px; font-weight: 600; }
.rail-item .pr { font-size: 12px; color: var(--gold-deep); font-weight: 600; margin-top: 2px; }

/* ---------- Hero ---------- */
.hero {
  position: relative; border-radius: 22px; overflow: hidden;
  background:
    radial-gradient(700px 320px at 85% -10%, rgba(182,138,62,.28), transparent 60%),
    radial-gradient(500px 260px at -5% 110%, rgba(201,166,143,.18), transparent 55%),
    linear-gradient(135deg, #23211c, #0f0e0c);
  color: #f6f1e7; padding: 64px 56px; margin-bottom: 40px;
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; align-items: center;
}
.hero .kicker { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: #e8cd8a; margin-bottom: 18px; }
.hero h1 { font-family: var(--serif); font-size: clamp(30px, 4vw, 52px); line-height: 1.12; font-weight: 600; }
.hero h1 em { font-style: normal; color: #e8cd8a; }
.hero p { margin-top: 18px; color: rgba(246,241,231,.78); font-size: 15.5px; line-height: 1.7; max-width: 520px; }
.hero .cta-row { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
.hero-art { display: grid; place-items: center; }
.hero-art svg { width: 100%; max-width: 320px; filter: drop-shadow(0 24px 50px rgba(0,0,0,.5)); }

/* ---------- Sections & headings ---------- */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.sec-head h2 { font-family: var(--serif); font-size: 26px; font-weight: 600; }
.sec-head .sub { color: var(--muted); font-size: 13.5px; }
.sec-link { color: var(--gold-deep); font-size: 13.5px; font-weight: 600; border: none; background: none; font-family: inherit; }
.sec-link:hover { text-decoration: underline; }
.section { margin-bottom: 46px; }

/* ---------- Cards ---------- */
.collections { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.collection-card {
  position: relative; border-radius: 18px; overflow: hidden; height: 220px;
  background: var(--ivory-2); border: 1px solid var(--line);
  transition: transform var(--ease), box-shadow var(--ease);
}
.collection-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.collection-card .bg { position: absolute; inset: 0; display: grid; place-items: center; }
.collection-card .bg svg { width: 64%; opacity: .85; }
.collection-card .cap { position: absolute; left: 16px; bottom: 14px; right: 16px; }
.collection-card .cap h3 { font-family: var(--serif); font-size: 19px; font-weight: 600; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.35); }
.collection-card .cap span { font-size: 12px; color: rgba(255,255,255,.85); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.grid.g2 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

.p-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  overflow: hidden; position: relative;
  transition: transform var(--ease), box-shadow var(--ease), border-color var(--ease);
}
.p-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: rgba(182,138,62,.35); }
.p-card .img-wrap { position: relative; aspect-ratio: 1 / 1; background: var(--ivory-2); overflow: hidden; cursor: pointer; }
.p-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.p-card:hover .img-wrap img { transform: scale(1.045); }
.p-card .fave {
  position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,.9); border: 1px solid var(--line); color: var(--ink-2);
  display: grid; place-items: center; transition: color var(--ease), transform var(--ease), background var(--ease);
}
.p-card .fave:hover { transform: scale(1.08); }
.p-card .fave.on { color: var(--rose); background: #fff; }
.p-card .fave.on svg { fill: currentColor; }
.p-card .qv {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  background: rgba(28,26,23,.82); color: #fff; border: none; border-radius: 999px;
  padding: 10px; font-size: 13px; font-weight: 600; font-family: inherit;
  opacity: 0; transform: translateY(8px); transition: opacity var(--ease), transform var(--ease), background var(--ease);
}
.p-card:hover .qv, .p-card:focus-within .qv { opacity: 1; transform: none; }
.p-card .qv:hover { background: var(--gold-deep); }
.p-card .tag { position: absolute; top: 12px; left: 12px; background: var(--gold-soft); color: var(--gold-deep); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.p-card .body { padding: 14px 16px 16px; }
.p-card .nm { font-weight: 600; font-size: 15px; }
.p-card .stk { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.p-card .specs { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
.p-card .specs span { font-size: 11px; color: var(--ink-2); background: var(--ivory); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
.p-card .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.p-card .price { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--gold-deep); }
.p-card .gia { font-size: 10.5px; font-weight: 700; color: var(--gold-deep); background: var(--gold-soft); padding: 4px 9px; border-radius: 999px; letter-spacing: .04em; }
.gia-svg { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  height: 48px; padding: 0 24px; border-radius: 999px;
  font-size: 14.5px; font-weight: 600; font-family: inherit;
  border: 1px solid transparent; white-space: nowrap;
  transition: transform var(--ease), box-shadow var(--ease), background var(--ease), border-color var(--ease), color var(--ease);
}
.btn:active { transform: scale(.98); }
.btn-primary { background: linear-gradient(135deg, #e8cd8a, var(--gold) 55%, var(--gold-deep)); color: #fff; box-shadow: 0 8px 24px rgba(182,138,62,.35); }
.btn-primary:hover { box-shadow: 0 12px 30px rgba(182,138,62,.45); transform: translateY(-1px); }
.btn-outline { background: #fff; border-color: var(--line-strong); color: var(--ink); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold-deep); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--ivory-2); color: var(--ink); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: #000; }
.btn-sm { height: 38px; padding: 0 16px; font-size: 13px; }
.btn-block { width: 100%; }

/* ---------- Chips / filters ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong); background: #fff; color: var(--ink-2);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; font-family: inherit;
  transition: border-color var(--ease), color var(--ease), background var(--ease);
}
.chip:hover { border-color: var(--gold); }
.chip.active { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-deep); font-weight: 600; }
.chip small { color: var(--muted); font-weight: 400; }
.chip-x {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
  background: var(--gold-soft); color: var(--gold-deep); border: 1px solid rgba(182,138,62,.4);
  padding: 6px 12px; font-size: 12.5px; font-weight: 600; font-family: inherit;
}
.chip-x button { background: none; border: none; color: inherit; font-size: 13px; display: grid; place-items: center; padding: 0; }
.fbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.fbar .spacer { flex: 1; }
.sort-select { height: 40px; border: 1px solid var(--line-strong); border-radius: 999px; background: #fff; color: var(--ink-2); padding: 0 12px; font-size: 13px; font-family: inherit; outline: none; }
.sort-select:focus { border-color: var(--gold); }
.f-sheet { padding: 8px 0 0; }
.f-group { margin-bottom: 18px; }
.f-group > h5 { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.f-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.f-range { display: flex; align-items: center; gap: 8px; }
.f-range input { flex: 1; min-width: 0; }
.range-input { width: 100%; accent-color: var(--gold); }
.f-foot { display: flex; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: #fff; }

/* ---------- Filter sheet (mobile) ---------- */
.sheet-overlay { position: fixed; inset: 0; background: rgba(28,26,23,.4); z-index: 120; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.f-sheet-panel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 121;
  background: #fff; border-radius: 22px 22px 0 0; max-height: 82vh;
  padding: 20px 22px 26px; overflow-y: auto;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
}
.f-sheet-panel.open { transform: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.sheet-head h3 { font-family: var(--serif); font-size: 21px; }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(28,26,23,.5); z-index: 130; display: grid; place-items: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal { background: #fff; border-radius: 20px; max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto; transform: translateY(12px) scale(.98); transition: transform .22s ease; }
.modal-overlay.open .modal { transform: none; }
.modal .m-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
.modal .m-head h3 { font-family: var(--serif); font-size: 20px; }
.modal .m-body { padding: 20px; }

/* ---------- Product detail ---------- */
.pd { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 44px; }
.pd-gallery { position: relative; }
.pd-gallery .main-img { aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; background: var(--ivory-2); position: relative; cursor: zoom-in; }
.pd-gallery .main-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.pd-gallery .main-img.zoomed img { transform: scale(1.9); cursor: zoom-out; }
.pd-thumbs { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; }
.pd-thumbs button { width: 74px; height: 74px; border-radius: 12px; overflow: hidden; border: 2px solid transparent; background: var(--ivory-2); flex-shrink: 0; padding: 0; transition: border-color var(--ease); }
.pd-thumbs button.active { border-color: var(--gold); }
.pd-thumbs img { width: 100%; height: 100%; object-fit: cover; }
.pd-bread { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
.pd-bread a { color: var(--gold-deep); }
.pd-info h1 { font-family: var(--serif); font-size: 32px; font-weight: 600; line-height: 1.15; }
.pd-info .stock { color: var(--muted); font-size: 13px; margin-top: 6px; }
.pd-price { font-family: var(--serif); font-size: 34px; font-weight: 600; color: var(--gold-deep); margin: 20px 0 4px; }
.pd-price small { font-size: 14px; color: var(--muted); font-weight: 500; }
.pd-avail { font-size: 13px; font-weight: 600; }
.pd-avail.ok { color: #3f8f52; }
.pd-avail.res { color: var(--gold-deep); }
.spec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 22px 0; }
.spec { background: var(--ivory); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; }
.spec .k { font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.spec .v { font-size: 14.5px; font-weight: 600; margin-top: 3px; }
.pd-actions { display: grid; gap: 10px; margin-top: 22px; }
.pd-desc { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
.pd-desc h3 { font-family: var(--serif); font-size: 19px; margin-bottom: 10px; }
.pd-desc p { color: var(--ink-2); line-height: 1.75; font-size: 14.5px; }
.gia-box { margin-top: 24px; background: var(--gold-soft); border: 1px solid rgba(182,138,62,.3); border-radius: var(--radius); padding: 16px 18px; }
.gia-box h4 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 8px; }
.gia-box p { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }

/* ---------- Lists (messages, orders, admin) ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
  transition: box-shadow var(--ease), border-color var(--ease), transform var(--ease);
}
.list-item:hover { box-shadow: var(--shadow-sm); border-color: rgba(182,138,62,.35); transform: translateY(-1px); }
.li-av { width: 48px; height: 48px; border-radius: 50%; background: var(--ivory-2); color: var(--gold-deep); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
.li-main { flex: 1; min-width: 0; }
.li-main .t { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.li-main .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.li-side { text-align: right; flex-shrink: 0; }
.li-side .t { font-size: 13.5px; font-weight: 600; }
.li-side .s { font-size: 11.5px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.gold { background: var(--gold); }

/* ---------- Stat cards (admin) ---------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
.stat {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; 
}
.stat .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.stat .v { font-family: var(--serif); font-size: 26px; font-weight: 600; margin-top: 6px; }
.stat .d { font-size: 12px; color: var(--gold-deep); margin-top: 4px; font-weight: 600; }

.table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.table th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--ivory); }
.table td { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: var(--ivory); }
.table .cell-p { display: flex; align-items: center; gap: 10px; }
.table .cell-p .th { width: 38px; height: 38px; border-radius: 8px; overflow: hidden; background: var(--ivory-2); flex-shrink: 0; }
.table .cell-p .th img { width: 100%; height: 100%; object-fit: cover; }
.tbtn { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-2); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; font-family: inherit; font-weight: 600; transition: border-color var(--ease), color var(--ease), background var(--ease); }
.tbtn:hover { border-color: var(--gold); color: var(--gold-deep); }
.tbtn.gold { background: var(--gold-soft); border-color: rgba(182,138,62,.4); color: var(--gold-deep); }
.tbtn.danger { color: #b3362a; border-color: rgba(179,54,42,.35); }
.tbtn.danger:hover { background: rgba(179,54,42,.08); }

/* ---------- Forms ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 7px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: #fff; color: var(--ink); padding: 12px 14px; font-size: 14px; font-family: inherit; outline: none;
  transition: border-color var(--ease), box-shadow var(--ease);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.field textarea { resize: vertical; min-height: 90px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

/* ---------- Sheets sync ---------- */
.sync-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; }
.sync-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sync-head h3 { font-family: var(--serif); font-size: 19px; }
.sync-status { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: #3f8f52; }
.sync-status .pulse { width: 9px; height: 9px; border-radius: 50%; background: #3f8f52; box-shadow: 0 0 0 4px rgba(63,143,82,.15); }
.sync-status.syncing .pulse { background: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); animation: pulse 1s ease infinite; }
.sync-status.err { color: #b3362a; }
.sync-status.err .pulse { background: #b3362a; box-shadow: 0 0 0 4px rgba(179,54,42,.15); }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .6; } }
.sync-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.sync-meta .m { background: var(--ivory); border-radius: var(--radius-sm); padding: 12px; }
.sync-meta .m .k { font-size: 11px; color: var(--muted); }
.sync-meta .m .v { font-size: 16px; font-weight: 700; margin-top: 3px; }
.sync-log { max-height: 200px; overflow-y: auto; background: var(--ivory); border-radius: var(--radius-sm); padding: 12px; font-size: 12px; line-height: 1.7; color: var(--ink-2); font-family: ui-monospace, Menlo, monospace; }
.sync-log .ok { color: #3f8f52; }
.sync-log .err { color: #b3362a; }

/* ---------- Education / about ---------- */
.edu-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 14px; }
.edu-card h3 { font-family: var(--serif); font-size: 18px; margin-bottom: 8px; }
.edu-card p { color: var(--ink-2); font-size: 14px; line-height: 1.7; }
.edu-card .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill { background: var(--gold-soft); color: var(--gold-deep); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; }

/* ---------- Messages view (WhatsApp-style) ---------- */
.wa-gold { --wa-gold: #D4AF37; }
.wa-shell {
  display: flex;
  height: calc(100dvh - var(--topbar-h) - var(--bottomnav-h) - 60px);
  margin: 14px 28px 26px;
  background: #fff; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.wa-list { width: 372px; min-width: 300px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: #fff; }
.wa-topbar { display: flex; align-items: center; gap: 4px; padding: 12px 14px 10px; }
.wa-title { flex: 1; font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--ink); }
.wa-icon-btn { width: 38px; height: 38px; border-radius: 50%; background: none; border: none; color: var(--ink-2); display: grid; place-items: center; flex-shrink: 0; transition: background var(--ease); }
.wa-icon-btn:hover { background: var(--ivory-2); color: var(--ink); }
.wa-search { position: relative; padding: 4px 14px 10px; }
.wa-search .wa-sico { position: absolute; left: 28px; top: 50%; transform: translateY(-55%); color: var(--muted); display: grid; pointer-events: none; }
.wa-search input { width: 100%; border: none; background: var(--ivory); border-radius: 999px; padding: 10px 16px 10px 38px; font-size: 14px; font-family: inherit; outline: none; color: var(--ink); }
.wa-search input:focus { box-shadow: 0 0 0 2px rgba(182, 138, 62, .28); }
.wa-list-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.wa-chat { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid rgba(28,26,23,.05); transition: background var(--ease); }
.wa-chat:hover { background: var(--ivory); }
.wa-chat.active { background: var(--ivory); }
.wa-chat.active .wa-name { color: var(--gold-deep); }
.wa-av { position: relative; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: linear-gradient(135deg, #e8cd8a, var(--gold) 60%, var(--gold-deep)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.wa-av img { width: 100%; height: 100%; object-fit: cover; }
.wa-av .online { position: absolute; right: 1px; bottom: 1px; width: 13px; height: 13px; border-radius: 50%; background: #22c55e; border: 2px solid #fff; }
.wa-chat-main { flex: 1; min-width: 0; }
.wa-row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wa-name { font-weight: 600; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-time { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.wa-row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 3px; }
.wa-prev { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-prev.unread { color: var(--ink); font-weight: 600; }
.wa-pin { margin-right: 3px; opacity: .6; }
.wa-unread { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #D4AF37; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 2px 8px rgba(212,175,55,.4); }
.wa-empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 48px 20px; }

/* Thread */
.wa-thread { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #F6F1E6; position: relative; }
.wa-thead { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line); }
.wa-thead .wa-av { width: 42px; height: 42px; font-size: 13px; }
.wa-back { display: none; }
.wa-tinfo { flex: 1; min-width: 0; }
.wa-tname { font-weight: 600; font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-tstatus { font-size: 12px; font-weight: 500; color: #16a34a; }
.wa-tstatus.away { color: var(--muted); font-weight: 400; }
.wa-msgs { flex: 1; overflow-y: auto; padding: 20px 18px 10px; display: flex; flex-direction: column; gap: 5px; min-height: 0; }
.wa-msg { max-width: 78%; display: flex; flex-direction: column; }
.wa-msg.in { align-self: flex-start; align-items: flex-start; }
.wa-msg.out { align-self: flex-end; align-items: flex-end; }
.wa-bub { padding: 9px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; position: relative; word-break: break-word; color: var(--ink); }
.wa-msg.in .wa-bub { background: #fff; border-top-left-radius: 4px; box-shadow: 0 1px 1px rgba(28,26,23,.06); }
.wa-msg.out .wa-bub { background: linear-gradient(135deg, #D4AF37, #b68a3e); color: #fff; border-top-right-radius: 4px; }
.wa-meta { display: flex; align-items: center; gap: 4px; font-size: 11px; margin-top: 3px; opacity: .78; }
.wa-msg.out .wa-meta { justify-content: flex-end; }
.wa-msg.in .wa-meta { color: var(--muted); }
.wa-msg.out .wa-meta { color: rgba(255,255,255,.9); }
.wa-tick { color: #fff; letter-spacing: -2px; font-size: 12px; }
.wa-tick.read { color: #cde8a6; }

/* Rich message content */
.wa-img { width: 220px; max-width: 100%; border-radius: 12px; display: block; cursor: zoom-in; }
.wa-share { min-width: 230px; max-width: 270px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(28,26,23,.08); }
.wa-msg.out .wa-share { background: #fff; }
.wa-msg.out .wa-bub .wa-share .nm, .wa-msg.out .wa-bub .wa-share .id, .wa-msg.out .wa-bub .wa-share .pr { color: var(--ink); }
.wa-share-top { display: flex; gap: 10px; padding: 10px; align-items: center; }
.wa-share-top img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
.wa-share-top .ws { min-width: 0; }
.wa-share-top .nm { display: block; font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-share-top .id { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.wa-share-bot { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--line); }
.wa-share-bot .pr { font-weight: 700; font-size: 14.5px; color: var(--gold-deep); }
.wa-mini { background: var(--gold-soft); color: var(--gold-deep); border: 1px solid rgba(182,138,62,.3); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 600; font-family: inherit; }
.wa-mini:hover { background: #D4AF37; color: #fff; border-color: #D4AF37; }
.wa-doc { display: flex; align-items: center; gap: 10px; min-width: 240px; max-width: 300px; padding: 6px; }
.wa-doc .doc-ico { width: 40px; height: 44px; flex-shrink: 0; display: grid; place-items: center; color: #D4AF37; background: rgba(212,175,55,.12); border-radius: 8px; }
.wa-doc .doc-meta { min-width: 0; flex: 1; }
.wa-doc .nm { display: block; font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-doc .id { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.wa-msg.out .wa-doc .nm { color: var(--ink); }
.wa-msg.out .wa-bub { padding: 6px; }
.wa-msg.out .wa-doc { background: #fff; border-radius: 12px; }

/* Typing indicator */
.wa-typing { display: inline-flex; align-items: center; gap: 4px; padding: 12px 16px; }
.wa-typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: waBlink 1.2s infinite; }
.wa-typing span:nth-child(2) { animation-delay: .18s; }
.wa-typing span:nth-child(3) { animation-delay: .36s; }
@keyframes waBlink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }

/* Quick actions + composer */
.wa-quick { display: flex; gap: 8px; padding: 10px 14px; background: #fff; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.wa-quick::-webkit-scrollbar { display: none; }
.wa-qbtn { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: var(--gold-soft); color: var(--gold-deep); border: 1px solid rgba(182,138,62,.28); border-radius: 999px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; font-family: inherit; transition: all var(--ease); }
.wa-qbtn:hover { background: #D4AF37; color: #fff; border-color: #D4AF37; }
.wa-composer { display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: #fff; border-top: 1px solid var(--line); }
.wa-composer input { flex: 1; min-width: 0; border: 1px solid var(--line-strong); border-radius: 999px; padding: 11px 18px; font-size: 14px; font-family: inherit; outline: none; color: var(--ink); background: #fff; }
.wa-composer input:focus { border-color: #D4AF37; box-shadow: 0 0 0 2px rgba(212,175,55,.2); }
.wa-send { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #D4AF37, #b68a3e); color: #fff; border: none; display: grid; place-items: center; flex-shrink: 0; transition: transform var(--ease); box-shadow: 0 4px 12px rgba(182,138,62,.35); }
.wa-send:hover { transform: scale(1.06); }
.wa-send:active { transform: scale(.96); }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .big { font-size: 44px; margin-bottom: 14px; opacity: .5; }
.empty h3 { font-family: var(--serif); color: var(--ink); font-size: 20px; margin-bottom: 6px; }
.empty p { font-size: 14px; margin-bottom: 18px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: calc(var(--bottomnav-h) + 18px); left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff; border-radius: 999px; padding: 12px 22px;
  font-size: 13.5px; font-weight: 600; z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 1400px) { .toast { left: 50%; } }

/* ---------- Bottom nav (mobile) ---------- */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--bottomnav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: none; align-items: stretch; justify-content: space-around;
  z-index: 70;
}
.bn-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600; font-family: inherit; position: relative; }
.bn-item .badge { position: absolute; top: 4px; left: 58%; min-width: 16px; height: 16px; padding: 0 4px; background: var(--gold); color: #fff; font-size: 9px; font-weight: 700; border-radius: 999px; display: grid; place-items: center; }
.bn-item.active { color: var(--gold-deep); }
.bn-item.active svg { stroke: var(--gold-deep); }

/* ---------- Drawer (mobile menu) ---------- */
.drawer-overlay { position: fixed; inset: 0; background: rgba(28,26,23,.45); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 86vw);
  background: #fff; z-index: 151; padding: 20px 18px 30px; overflow-y: auto;
  transform: translateX(-102%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.drawer .d-group { margin-bottom: 18px; }
.drawer .d-title { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); padding: 0 8px 8px; }
.drawer .d-item { display: flex; align-items: center; gap: 12px; padding: 11px 8px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--ink-2); background: none; border: none; width: 100%; text-align: left; font-family: inherit; }
.drawer .d-item:hover { background: var(--ivory-2); }
.drawer .d-item.active { background: var(--gold-soft); color: var(--gold-deep); font-weight: 600; }
.drawer .d-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.drawer .d-quick { display: flex; align-items: center; gap: 10px; background: var(--ivory); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); font-family: inherit; width: 100%; text-align: left; }
.drawer .d-quick:hover { border-color: var(--gold); }

/* ---------- Page headers ---------- */
.page-head { margin-bottom: 26px; }
.page-head h1 { font-family: var(--serif); font-size: clamp(26px, 3vw, 38px); font-weight: 600; }
.page-head p { color: var(--muted); font-size: 14px; margin-top: 6px; max-width: 620px; line-height: 1.6; }
.bread { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
.bread a { color: var(--gold-deep); }
.bread a:hover { text-decoration: underline; }

/* ---------- Bag / checkout ---------- */
.bag-item { display: flex; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.bag-item .th { width: 88px; height: 88px; border-radius: 12px; overflow: hidden; background: var(--ivory-2); flex-shrink: 0; }
.bag-item .th img { width: 100%; height: 100%; object-fit: cover; }
.bag-item .mi { flex: 1; min-width: 0; }
.bag-item .mi .nm { font-weight: 600; font-size: 14.5px; }
.bag-item .mi .pr { color: var(--gold-deep); font-weight: 700; font-size: 15px; margin-top: 4px; }
.bag-item .qty { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-strong); background: #fff; color: var(--ink-2); display: grid; place-items: center; font-size: 15px; }
.qty button:hover { border-color: var(--gold); color: var(--gold-deep); }
.bag-summary { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; position: sticky; top: calc(var(--topbar-h) + 16px); }
.bag-summary .r { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; color: var(--ink-2); }
.bag-summary .r.total { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 14px; font-weight: 700; color: var(--ink); font-size: 16px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }

/* ---------- Profile ---------- */
.profile-head { display: flex; align-items: center; gap: 18px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 22px; margin-bottom: 24px; }
.profile-av { width: 76px; height: 76px; border-radius: 50%; background: linear-gradient(135deg, #e8cd8a, var(--gold)); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 700; font-family: var(--serif); }
.profile-head h2 { font-family: var(--serif); font-size: 22px; }
.profile-head p { color: var(--muted); font-size: 13px; margin-top: 3px; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.panel h3 { font-family: var(--serif); font-size: 18px; margin-bottom: 12px; }

/* ---------- Tabs (admin) ---------- */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tab { background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--muted); padding: 12px 16px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--gold-deep); border-bottom-color: var(--gold); }

/* ---------- Skeleton ---------- */
.skel { position: relative; overflow: hidden; background: var(--ivory-2); border-radius: 18px; }
.skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shimmer 1.3s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.skel .img { aspect-ratio: 1/1; }
.skel .ln { height: 12px; margin: 12px 16px 0; }
.skel .ln.w60 { width: 60%; } .skel .ln.w40 { width: 40%; }
.skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin: 24px 0; }

/* ---------- Empty rail fallback ---------- */
@media (max-width: 1439px) { .rail { display: none; } body.rail-on .main { margin-right: 0; } }

/* ---------- Responsive ---------- */
@media (max-width: 1024px) {
  .pd { grid-template-columns: 1fr; gap: 26px; }
  .hero { grid-template-columns: 1fr; padding: 44px 30px; }

}

}
@media (max-width: 420px) {

}
@media (max-width: 900px) {

}
@media (prefers-reduced-motion: reduce) {

}

function isActive(v, p) {
  if (v === "cat" && p) return VIEW.current === "explore" && (S.filters.cat || "all") === p;
  if (v === "explore") return VIEW.current === "explore" && !S.filters.cat;
  if (v === "newarrivals") return VIEW.current === "explore" && S.filters.newArr;
  return VIEW.current === v;
}

function renderSidebar() {
  document.getElementById("side-inner").innerHTML = NAV_GROUPS.map(g => `
    <div class="side-group">
      <div class="side-group-title">${t(g.title)}</div>
      ${g.items.map(it => `
        <button class="side-item ${isActive(it.v, it.p) ? 'active' : ''}" onclick="nav('${it.v}','${it.p || ''}')">
          ${it.icon}<span>${t(it.label)}</span>
        </button>`).join("")}
    </div>`).join("") + `
    <div class="side-collapse">
      <button class="collapse-btn" onclick="toggleNav()" aria-label="Collapse menu">
        <span id="collapse-ico">${IC.collapse}</span><span class="lbl">${t("collapse_menu")}</span>
      </button>
    </div>`;
}

function renderDrawer() {
  document.getElementById("drawer-body").innerHTML = NAV_GROUPS.map(g => `
    <div class="d-group">
      <div class="d-title">${t(g.title)}</div>
      ${g.items.map(it => `
        <button class="d-item ${isActive(it.v, it.p) ? 'active' : ''}" onclick="closeDrawer(); nav('${it.v}','${it.p || ''}')">${it.icon}<span>${t(it.label)}</span></button>`).join("")}
    </div>`).join("");
}

function toggleNav() {
  document.body.classList.toggle("nav-open");
  document.getElementById("collapse-ico").innerHTML = document.body.classList.contains("nav-open") ? IC.chev : IC.collapse;
}
function openDrawer() {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-overlay").classList.add("open");
  renderDrawer();
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawer-overlay").classList.remove("open");
}
function closeSheet() {
  document.getElementById("sheet-panel").classList.remove("open");
  document.getElementById("sheet-overlay").classList.remove("open");
}
function closeModal() { document.getElementById("modal-overlay").classList.remove("open"); }
function openSheet(html) {
  document.getElementById("sheet-panel").innerHTML = html;
  requestAnimationFrame(() => {
    document.getElementById("sheet-panel").classList.add("open");
    document.getElementById("sheet-overlay").classList.add("open");
  });
}

/* ---------------- Helpers ---------------- */
function fmt(n) { return new Intl.NumberFormat("en-US", { style: "currency", currency: S.currency, maximumFractionDigits: 0 }).format(n); }
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.innerHTML = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
function updateBadges() {
  document.getElementById("bag-badge").textContent = S.bag.reduce((a, b) => a + b.qty, 0);

function isFav(id) { return S.fav.includes(id); }
function toggleFav(id) {
  const i = S.fav.indexOf(id);

}
function addToBag(id) {
  const i = S.bag.findIndex(b => b.id === id);
  if (i > -1) S.bag[i].qty++;
  else S.bag.push({ id, qty: 1 });
  persist(); updateBadges(); renderRail();
  toast(t("to_bag"));
}
function setBagQty(id, qty) {
  const i = S.bag.findIndex(b => b.id === id);
  if (i === -1) return;
  if (qty <= 0) S.bag.splice(i, 1); else S.bag[i].qty = qty;

}
function recordRecent(id) {

const COLOR_OPTS = ["Pink", "Blue", "Yellow", "Orange", "Purple-Pink", "Champagne"];
const SHAPE_OPTS = ["Round", "Oval", "Cushion", "Pear", "Emerald", "Marquise", "Asscher", "Heart", "Radiant"];
const CATS = [
  { v: "", label: "All" }, { v: "diamond", label: "Diamonds" },
  { v: "rings", label: "Rings" }, { v: "earrings", label: "Earrings" },
  { v: "necklaces", label: "Necklaces" }, { v: "bracelets", label: "Bracelets" }
];

function applyFilters() {
  const f = S.filters;
  let list = PRODUCTS.slice();
  if (f.cat && f.cat !== "all" && f.cat !== "") {
    if (f.cat === "diamond") list = list.filter(x => x.type === "diamond");
    else list = list.filter(x => x.jewelryType === f.cat);
  }
  if (f.newArr) list = list.filter(x => x.tag === "New" || ["d3","j3","d8"].includes(x.id));
  if (f.colors && f.colors.length) list = list.filter(x => f.colors.includes(x.color));
  if (f.shapes && f.shapes.length) list = list.filter(x => f.shapes.includes(x.shape));
  if (f.caratMin) list = list.filter(x => x.carat >= f.caratMin);
  if (f.caratMax) list = list.filter(x => x.carat <= f.caratMax);
  if (f.priceMin) list = list.filter(x => x.price >= f.priceMin);
  if (f.priceMax) list = list.filter(x => x.price <= f.priceMax);
  if (f.gia) list = list.filter(x => x.gia);
  if (f.avail) list = list.filter(x => x.avail === f.avail);
  if (f.query) { const q = f.query.toLowerCase(); list = list.filter(x => (x.name + " " + x.stock + " " + x.color + " " + x.shape + " " + x.carat + " " + (x.gia||"")).toLowerCase().includes(q)); }
  const sort = S.sort;
  if (sort === "price-asc") list.sort((a, b) => a.price - b.price);
  if (sort === "price-desc") list.sort((a, b) => b.price - a.price);
  if (sort === "carat") list.sort((a, b) => b.carat - a.carat);
  return list;
}

function activeChips() {
  const f = S.filters; const chips = [];
  if (f.cat && f.cat !== "" && f.cat !== "all") chips.push({ k: "cat", label: "Category: " + (CATS.find(c => c.v === f.cat)?.label || f.cat) });
  if (f.newArr) chips.push({ k: "newArr", label: "New arrivals" });
  (f.colors || []).forEach(c => chips.push({ k: "colors", val: c, label: c }));
  (f.shapes || []).forEach(s => chips.push({ k: "shapes", val: s, label: s + " cut" }));
  if (f.caratMin) chips.push({ k: "caratMin", label: "≥ " + f.caratMin + "ct" });
  if (f.caratMax) chips.push({ k: "caratMax", label: "≤ " + f.caratMax + "ct" });
  if (f.priceMin) chips.push({ k: "priceMin", label: "≥ " + fmt(f.priceMin) });
  if (f.priceMax) chips.push({ k: "priceMax", label: "≤ " + fmt(f.priceMax) });
  if (f.gia) chips.push({ k: "gia", label: "GIA certified" });
  if (f.avail) chips.push({ k: "avail", label: f.avail === "now" ? "Available now" : "By reservation" });
  return chips;
}
function removeChip(chip) {
  const f = S.filters;
  if (chip.val !== undefined) { f[chip.k] = (f[chip.k] || []).filter(x => x !== chip.val); if (!f[chip.k].length) delete f[chip.k]; }
  else delete f[chip.k];
  persist(); renderCurrent();
}

function setFilter(k, v) {
  S.filters[k] = v;
  if (!v) delete S.filters[k];
  persist();
  if (k === "gia") return;
  renderCurrent(); openSheet(filterPanel());
}
function togFilter(k, val) {
  if (!S.filters[k]) S.filters[k] = [];
  const arr = S.filters[k];
  const i = arr.indexOf(val);
  if (i > -1) arr.splice(i, 1); else arr.push(val);
  if (!arr.length) delete S.filters[k];
  persist(); renderCurrent(); openSheet(filterPanel());
}

function renderMessages() {
  const m = document.getElementById("main");
  m.innerHTML = `
  <div class="wa-shell">
    <div class="wa-list">${waList()}</div>
    <div class="wa-thread">${waThread(getMsg(activeMsg))}</div>
  </div>`;
  syncMsgShell();
  scrollMsgs();
  setTimeout(() => { const i = document.getElementById("msg-input"); if (i && (msgView === "chat" || !isMobile())) i.focus(); }, 60);
}
function scrollMsgs() {
  requestAnimationFrame(() => { const el = document.getElementById("wa-msgs"); if (el) el.scrollTop = el.scrollHeight; });
}
function openMsg(id) {
  const c = getMsg(id); if (!c) return;
  activeMsg = id; msgView = "chat"; c.unread = 0;
  renderMessages(); updateBadges();
}
function backMsg() { msgView = "list"; renderMessages(); }
function toggleMsgSearch() {
  msgSearchOpen = !msgSearchOpen; renderMessages();
  if (msgSearchOpen) setTimeout(() => { const i = document.getElementById("wa-q"); if (i) i.focus(); }, 60);
}
function openMsgFilter() {
  openSheet(`
    <div class="sheet-head"><h3>${t("msg_filter_title")}</h3></div>
    <div class="f-sheet">
      <div class="f-group">
        <h5>${t("msg_show")}</h5>
        <div class="f-opts">
          ${[["all", t("all")], ["unread", t("unread")], ["pinned", t("pinned")]].map(([v, l]) => `<button class="chip ${msgFilter === v ? "active" : ""}" onclick="setMsgFilter('${v}')">${l}</button>`).join("")}
        </div>
      </div>
    </div>`);
}
function setMsgFilter(v) { msgFilter = v; closeSheet(); renderMessages(); }
function sendMsg(id) {
  const inp = document.getElementById("msg-input");
  const t = inp ? inp.value.trim() : "";
  if (!t) return;
  const c = getMsg(id);
  const now = fmtTime();
  c.thread.push({ who: "me", type: "text", text: t, time: now });
  c.last = t; c.me = true; c.time = now; c.unread = 0;
  if (inp) inp.value = "";
  renderMessages(); scrollMsgs();
  replySoon(id, [{ who: "them", type: "text", text: "Thank you — one of our specialists will be with you shortly." }], 1500);
}
function replySoon(id, fromMsgs, delay) {
  const c = getMsg(id); if (!c) return;
  c.typing = true;
  renderMessages(); scrollMsgs();
  setTimeout(() => {
    const c2 = getMsg(id); if (!c2) return;
    c2.typing = false;
    const now = fmtTime();
    fromMsgs.forEach(m => { m.time = now; c2.thread.push(m); });
    c2.last = fromMsgs[fromMsgs.length - 1].text || "Attachment sent";
    c2.me = false; c2.time = now; c2.unread = 0;
    renderMessages(); scrollMsgs();
  }, delay || 1700);
}
function targetProduct(id) {
  const c = getMsg(id); if (!c) return PRODUCTS[0];
  const m = c.thread.slice().reverse().find(x => (x.type === "product" || x.type === "quote") && x.id);
  return (m && p(m.id)) || PRODUCTS[0];
}
function sendCert(id) {
  sendMsgText(id, "Please send the GIA certificate and 360° video for CD-1024.");
  replySoon(id, [
    { who: "them", type: "doc", name: "GIA Certificate — CD-1024.pdf", size: "1.2 MB", text: "Here is the GIA report." },
    { who: "them", type: "text", text: "And the 360° video has been added to your gallery." }
  ], 1800);
}
function sendSimilar(id) {
  const base = targetProduct(id);
  const cands = PRODUCTS.filter(x => x.type === "diamond" && x.id !== base.id).slice(0, 2);
  sendMsgText(id, "Could you also share two similar diamonds in the same budget?");
  replySoon(id, cands.map(x => ({ who: "them", type: "product", id: x.id, text: "Similar option:" })), 1900);
}
function sendQuote(id) {
  const prod = targetProduct(id);
  sendMsgText(id, "Could you send me your best quote for this stone?");
  replySoon(id, [{ who: "them", type: "quote", id: prod.id, price: prod.price, text: "Reserved for you at this price until Friday:" }], 1800);
}
function bookConsult(id) { go("consultation"); }
function sendMsgText(id, t) {
  const c = getMsg(id);
  const now = fmtTime();
  c.thread.push({ who: "me", type: "text", text: t, time: now });
  c.last = t; c.me = true; c.time = now; c.unread = 0;
  renderMessages(); scrollMsgs();
}

function placeOrder() {
  const items = S.bag.map(b => ({ ...b, prod: p(b.id) }));
  if (!items.length) return toast(t("bag_empty_title"));
  const total = items.reduce((a, x) => a + x.prod.price * x.qty, 0);
  const no = "CD-" + Math.floor(100000 + Math.random() * 900000);
  const date = new Date().toLocaleDateString("en-GB");
  S.orders.unshift({ no, date, items: items.length, total, status: t("st_confirmed"), delivered: false, ids: items.map(x => x.id) });
  if (!S.purchases) S.purchases = [];
  S.purchases.unshift({ no, date, items: items.length, total, status: t("st_delivered"), ids: items.map(x => x.id) });
  S.bag = [];
  persist(); updateBadges();
  toast(t("order_placed"));
  go("purchases");
}

function runSync(scope) {
  const btn = document.getElementById("sync-btn") || (document.querySelector(".sync-card .btn"));
  if (btn) { btn.textContent = "Synchronizing…"; btn.disabled = true; }
  const st = document.getElementById("sync-status");
  const sl = document.getElementById("sync-label");
  if (st) st.classList.add("syncing");
  if (sl) sl.textContent = " Syncing";
  const log = document.getElementById("sync-log");
  if (log) log.innerHTML = '<div class="ok">→ Contacting Google Sheets…</div>' + log.innerHTML;
  setTimeout(() => {
    if (btn) { btn.textContent = "Synchronize now"; btn.disabled = false; }
    if (st) st.classList.remove("syncing");
    if (sl) sl.textContent = " Connected";
    if (log) log.innerHTML = '<div class="ok">✓ Now — Sync complete · 14 products up to date · 0 errors</div>' + log.innerHTML;
    const c = document.getElementById("sync-count"); if (c) c.textContent = "14";
    const l = document.getElementById("sync-last"); if (l) l.textContent = "Now";
    toast("Synchronization complete — 14 products updated");
    if (scope === "overview") renderAdmin();
  }, 1800);
}

/* ---------------- Biometrics / Touch ID ---------------- */
function bioAvailable() {
  return !!(window.PublicKeyCredential && navigator.credentials && (window.isSecureContext || location.hostname === "localhost" || location.hostname === "127.0.0.1"));
}
async function setupTouchId() {
  if (!bioAvailable()) return toast(t("sec_unsupported"));
  const rpId = location.hostname || "localhost";
  try {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: new Uint8Array(32).map(() => Math.floor(Math.random() * 256)),
        rp: { name: "Colour Diam", id: rpId },
        user: { id: new TextEncoder().encode("colourdiam-user"), name: "alexandra", displayName: "Alexandra Laurent" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000
      }
    });
    if (cred) {
      const raw = new Uint8Array(cred.rawId);
      S.sec.touchid = true;
      S.sec.cred = { id: cred.id, rawId: btoa(String.fromCharCode.apply(null, raw)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") };
      persist(); renderCurrent();
      toast(t("sec_enabled_toast"));
    }
  } catch (e) {
    toast(t("sec_unsupported"));
  }
}
async function removeTouchId() {
  S.sec.touchid = false;
  S.sec.cred = null;
  persist(); renderCurrent();
  toast(t("sec_disabled_toast"));
}
async function verifyTouchId() {
  if (!S.sec || !S.sec.cred) return false;
  const b64 = S.sec.cred.rawId.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge: new Uint8Array(32).map(() => Math.floor(Math.random() * 256)),
      allowCredentials: [{ type: "public-key", id: arr }],
      userVerification: "required",
      timeout: 60000
    }
  });
  return !!assertion;
}
function lockApp() {
  if (!S.sec || !S.sec.touchid) return toast(t("sec_touchid") + " → " + t("sec_off"));
  const ls = document.getElementById("lock-screen");
  if (!ls) return;
  ls.hidden = false;
  document.getElementById("lock-hint").textContent = t("sec_touchid_hint");
  const fab = document.getElementById("lock-fab");
  fab.classList.remove("busy");
  setTimeout(tryUnlock, 350);
}
async function tryUnlock() {
  const fab = document.getElementById("lock-fab");
  const hint = document.getElementById("lock-hint");
  fab.classList.add("busy");
  hint.textContent = t("sec_touchid_hint") + " …";
  try {
    const ok = await verifyTouchId();
    if (ok) document.getElementById("lock-screen").hidden = true;
    else hint.textContent = t("sec_touchid_failed");
  } catch (e) {
    hint.textContent = t("sec_touchid_failed");
  } finally {
    fab.classList.remove("busy");
  }
}
function skipLock() {
  document.getElementById("lock-screen").hidden = true;
}
